# Configuration file

general {
    # Should the Grim Reaper boss be enabled?
    B:"Allow Grim Reaper?"=true

    # Enables or disables player marriage.
    B:"Allow Player Marriage?"=true

    # If enabled, generates rose gold in your world. If disabled, generates stone instead.
    B:"Allow Rose Gold World Generation"=true

    # Allow villagers to marry players of the same gender.
    B:"Allow Same Gender Marriage"=true

    # Minutes it takes for a baby to be ready to grow up.
    I:"Baby Grow Up Time (Minutes)"=30

    # Number of hearts required to give a bouquet (promise).
    I:"Bouquet Hearts Requirement"=25

    # Chance that a villager will be infected on hit from a zombie. Default is 5 for 5%.
    I:"Chance of Infection"=5

    # Chance that you will have twins. Default is 2 for 2%.
    I:"Chance to Have Twins"=2

    # Minutes it takes for a child to grow into an adult.
    I:"Child Grow Up Time (Minutes)"=60

    # Enables or disables MCA admin commands for ops.
    B:"Enable Admin Commands?"=true

    # Should interactions yield diminishing returns over time?
    B:"Enable Interaction Fatigue?"=true

    # Should reviving dead villagers be enabled?
    B:"Enable Revivals?"=true

    # Is trading with villagers enabled?
    B:"Enable Trading?"=true

    # If enabled, limits the maximum number of villagers in a village.
    B:"Enable Village Population Cap"=true

    # Should zombies be able to infect villagers?
    B:"Enable Zombie Infection?"=true

    # Number of hearts required to get engaged.
    I:"Engagement Hearts Requirement"=50
    D:"Fraction Of Vanilla Villages"=0.0

    # Minimum genetic similarity required for relationship compatibility. (0.0-1.0)
    D:"Genetic Compatibility Threshold"=0.3

    # Enable guards to patrol around the village.
    B:"Guard Patrol Enabled"=true

    # Radius within which guards will search for their village.
    I:"Guard Patrol Radius"=64

    # Movement speed of guards while patrolling.
    D:"Guard Patrol Speed"=0.5

    # Time in ticks a guard will wait at each patrol point before moving to the next.
    I:"Guard Patrol Wait Time"=120

    # How many villagers that should be in a village before a guard spawns.
    I:"Guard Spawn Rate"=6

    # Reduction in infection chance per villager trading level.
    D:"Infection Chance Decrease Per Level"=0.25

    # Time in ticks until a villager turns into a zombie after infection. 20 ticks = 1 second; 72000 ticks = 1 hour.
    I:"Infection Time"=72000

    # Reduction in infection chance if an infirmary is nearby (50% reduction by default).
    D:"Infirmary Infection Chance Reduction"=0.5

    # Should villager deaths be logged?
    B:"Log Villager Deaths?"=true

    # In 'coexist' mode, chance that a spawning villager is MCA type (0.0-1.0). Default 0.5 (50%).
    D:"MCA Villager Spawn Ratio"=0.5

    # Number of hearts required to get married.
    I:"Marriage Hearts Requirement"=100
    B:"Overwrite Original Villagers?"=true

    # Maximum number of villagers allowed in a single village. Includes guards and children.
    I:"Village Population Cap"=50

    # Formatting prefix used for all chat with villagers.
    S:"Villager Chat Prefix"=

    # Each villager's maximum health. 1 point equals 1 heart.
    I:"Villager Max Health"=20

    # Modes: 'replace' - all vanilla villagers become MCA villagers; 'coexist' - both types spawn together; 'vanilla' - keep original villagers only.
    S:"Villager Spawn Mode"=replace

    # Maximum number of villagers that a spawner will create in the area before it stops.
    I:"Villager Spawner Cap"=5

    # The spawner will spawn 1 villager per this many minutes.
    I:"Villager Spawner Rate"=30
}


genetics {
    # Chance for a villager to be an 'immigrant' with random genes. (0.0-1.0)
    D:"Genetic Immigrant Chance"=0.1

    # Base chance for a villager to have a trait. (0.0-1.0)
    D:"Trait Chance"=0.1

    # Chance for a trait to be inherited. (0.0-1.0)
    D:"Trait Inherit Chance"=0.5
}


gifts {
    # Exponent applied to gift value for desaturation calculation.
    D:"Gift Desaturation Exponent"=0.5

    # Factor applied to gift desaturation penalty. (0.0-1.0)
    D:"Gift Desaturation Factor"=0.5

    # Number of recent gifts remembered for desaturation calculation.
    I:"Gift Desaturation Queue Length"=10

    # Multiplier for final gift value. 1.0 = normal, 2.0 = double, 0.5 = half.
    D:"Gift Satisfaction Factor"=1.0
}


