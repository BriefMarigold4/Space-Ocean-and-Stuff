    D:sparkOpacity=0.7

    # Size of the sparks particles. Default: 5.3
    D:sparkSize=5.300000190734863

    # Scale multiplier for the sparks particles. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:sparksScale=1.0

    # Animation speed multiplier for the sparks particles. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:sparksSpeed=1.0

    # Scale multiplier for the underwater blast wave particle. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:underwaterBlastWaveScale=1.0

    # Animation speed multiplier for the underwater blast wave particle. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:underwaterBlastWaveSpeed=1.0

    # If set to false, the mod won't spawn underwater specific particles.
    B:underwaterExplosions=true

    # Opacity of the underwater sparks particles. Default: 0.30
