# Configuration file

general {
    # Always render particles regardless of distance/culling. Default: false
    B:alwaysShow=false

    # Attempt to offset small 1-power explosions slightly downwards to look better. Default: true
    B:attemptBetterSmallExplosions=true

    # Amount of extra power to add to big explosions when extraPower is true. Default: 0.0
    D:bigExtraPower=0.0

    # Scale multiplier for the blast wave particle. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:blastWaveScale=1.0

    # Animation speed multiplier for the blast wave particle. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:blastWaveSpeed=1.0

    # Amount of bubbles to spawn in underwater explosions. Default: 50
    # Min: 0
    # Max: 1000
    I:bubbleAmount=50

    # If set to true, the mod will log debug information.
    B:debugLogs=false

    # Whether the size of the explosion matters for the visual scale of particles. Default: true
    B:dynamicSize=true

    # Whether the size of the explosion matters for the visual scale of underwater particles. Default: true
    B:dynamicUnderwater=true

    # Whether the main explosion particles should be brightly emissive (glow in the dark). Default: true
    B:emissiveExplosion=true

    # Whether the underwater explosion particles should be brightly emissive (glow in the dark). Default: true
    B:emissiveWaterExplosion=true

    # Whether to add extra power (size) to the visual explosion artificially. Default: false
    B:extraPower=false

    # Scale multiplier for the fireball particle. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:fireballScale=1.0

    # Animation speed multiplier for the fireball particle. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:fireballSpeed=1.0

    # If set to false, the mod won't replace vanilla explosion particles.
    B:modEnabled=true

    # Scale multiplier for the underwater shockwave particle. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:shockwaveScale=1.0

    # Animation speed multiplier for the underwater shockwave particle. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:shockwaveSpeed=1.0

    # Whether to show the custom blast wave particle. Default: true
    B:showBlastWave=true

    # If set to false, the bubble particles won't spawn.
    B:showBubbles=true

    # Whether to KEEP showing the default vanilla explosion particles alongside the new ones. Default: false
    B:showDefaultExplosion=false

    # Whether to KEEP showing the default vanilla explosion particles underwater. Default: false
    B:showDefaultExplosionUnderwater=false

    # Whether to KEEP showing the default vanilla smoke particles alongside the new ones. Default: false
