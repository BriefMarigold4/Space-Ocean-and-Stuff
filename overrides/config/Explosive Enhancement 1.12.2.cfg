    # Whether to show the custom fireball particle. Default: true
    B:showFireball=true

    # Whether to show the mushroom cloud smoke effect. Default: true
    B:showMushroomCloud=true

    # Whether to show the custom underwater shockwave particle. Default: true
    B:showShockwave=true

    # Whether to show the custom sparks particles. Default: true
    B:showSparks=true

    # Whether to show the custom underwater blast wave particle. Default: true
    B:showUnderwaterBlastWave=true

    # Whether to show custom underwater sparks. Default: false
    B:showUnderwaterSparks=false

    # The Y offset to apply to small 1-power explosions. Default: -0.5
    D:smallExplosionYOffset=-0.5

    # Amount of extra power to add to small explosions when extraPower is true. Default: 0.0
    D:smallExtraPower=0.0

    # Scale multiplier for the smoke particles. Default: 1.0 (Higher = Larger)
    # Min: 0.1
    # Max: 10.0
    D:smokeScale=1.0

    # Animation speed multiplier for the smoke particles. Default: 1.0 (Higher = Faster)
    # Min: 0.1
    # Max: 10.0
    D:smokeSpeed=1.0

    # Opacity of the sparks particles. Default: 0.70
    # Min: 0.0
